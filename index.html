<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0f172a">
  <title>Diet Tracker</title>

  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --card2: #273449;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #22c55e;
      --accent2: #38bdf8;
      --danger: #ef4444;
      --warning: #f59e0b;
      --radius: 18px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", Arial, sans-serif;
      overscroll-behavior-y: none;
    }

    body {
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }

    .app {
      max-width: 520px;
      margin: 0 auto;
      padding: 16px 16px 110px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    h1 {
      font-size: 24px;
      margin: 0;
      letter-spacing: -0.4px;
    }

    .date {
      color: var(--muted);
      font-size: 13px;
    }

    .screen {
      display: none;
      animation: fadeIn 0.18s ease;
    }

    .screen.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: none; }
    }

    .card {
      background: var(--card);
      border: 1px solid rgba(148,163,184,0.15);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 14px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.22);
    }

    .card h2 {
      margin: 0 0 12px;
      font-size: 17px;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .stat {
      background: var(--card2);
      border-radius: 14px;
      padding: 12px;
    }

    .stat-label {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 5px;
    }

    .stat-value {
      font-size: 20px;
      font-weight: 700;
    }

    .progress {
      height: 10px;
      border-radius: 999px;
      background: #334155;
      overflow: hidden;
      margin-top: 12px;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      transition: width 0.25s ease;
    }

    .progress-bar.over {
      background: var(--danger);
    }

    .macro-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 12px;
    }

    .macro {
      background: var(--card2);
      border-radius: 12px;
      padding: 10px;
      text-align: center;
    }

    .macro small {
      display: block;
      color: var(--muted);
      font-size: 11px;
      margin-bottom: 4px;
    }

    .macro strong {
      font-size: 15px;
    }

    label {
      display: block;
      font-size: 13px;
      color: var(--muted);
      margin: 10px 0 6px;
    }

    input {
      width: 100%;
      min-height: 48px;
      background: #0b1220;
      color: var(--text);
      border: 1px solid #334155;
      border-radius: 14px;
      padding: 12px 14px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: var(--accent2);
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .full {
      grid-column: 1 / -1;
    }

    button {
      font: inherit;
      border: none;
      border-radius: 14px;
      min-height: 48px;
      padding: 12px 16px;
      font-weight: 600;
      color: #052e16;
      background: var(--accent);
      cursor: pointer;
      transition: transform 0.08s ease, opacity 0.15s ease;
    }

    button:active {
      transform: scale(0.98);
    }

    .secondary {
      background: var(--card2);
      color: var(--text);
      border: 1px solid #3b4a61;
    }

    .danger {
      background: var(--danger);
      color: white;
    }

    .small {
      min-height: 40px;
      padding: 8px 12px;
      font-size: 14px;
      border-radius: 12px;
    }

    .button-row {
      display: flex;
      gap: 10px;
      margin-top: 14px;
    }

    .button-row button {
      flex: 1;
    }

    .entry {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: var(--card2);
      border-radius: 14px;
      padding: 12px;
      margin-bottom: 10px;
    }

    .entry-info {
      min-width: 0;
    }

    .entry-name {
      font-weight: 700;
      margin-bottom: 3px;
      overflow-wrap: anywhere;
    }

    .entry-macros {
      font-size: 12px;
      color: var(--muted);
    }

    .entry-actions {
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }

    .empty {
      text-align: center;
      color: var(--muted);
      padding: 24px 10px;
      font-size: 14px;
    }

    nav {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(15,23,42,0.94);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-top: 1px solid rgba(148,163,184,0.18);
      display: flex;
      padding: 8px 10px calc(8px + env(safe-area-inset-bottom));
      z-index: 20;
    }

    nav button {
      flex: 1;
      background: transparent;
      color: var(--muted);
      border-radius: 12px;
      min-height: 54px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      font-size: 11px;
      font-weight: 600;
    }

    nav button.active {
      color: var(--accent);
      background: rgba(34,197,94,0.12);
    }

    nav .icon {
      font-size: 20px;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 95px;
      transform: translateX(-50%) translateY(20px);
      background: #111827;
      border: 1px solid #334155;
      color: var(--text);
      padding: 12px 16px;
      border-radius: 999px;
      font-size: 14px;
      opacity: 0;
      pointer-events: none;
      transition: 0.2s ease;
      z-index: 50;
      max-width: 90%;
      text-align: center;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .confirm-box {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.65);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 60;
    }

    .confirm-box.show {
      display: flex;
    }

    .confirm-card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 20px;
      width: 100%;
      max-width: 360px;
    }

    .confirm-card h3 {
      margin: 0 0 8px;
    }

    .confirm-card p {
      color: var(--muted);
      margin: 0 0 16px;
      font-size: 14px;
    }

    @media (min-width: 480px) {
      .summary-grid {
        grid-template-columns: repeat(4, 1fr);
      }
    }
  </style>
</head>

<body>
  <div class="app">
    <header>
      <div>
        <h1>Diet Tracker</h1>
        <div class="date" id="todayDate"></div>
      </div>
      <button class="secondary small" id="settingsButton">Goals</button>
    </header>

    <!-- TODAY -->
    <section class="screen active" id="screen-today">
      <div class="card">
        <h2>Today’s intake</h2>
        <div class="summary-grid">
          <div class="stat">
            <div class="stat-label">Calories</div>
            <div class="stat-value"><span id="caloriesToday">0</span></div>
          </div>
          <div class="stat">
            <div class="stat-label">Calorie goal</div>
            <div class="stat-value"><span id="calorieGoalDisplay">0</span></div>
          </div>
          <div class="stat">
            <div class="stat-label">Remaining</div>
            <div class="stat-value"><span id="caloriesRemaining">0</span></div>
          </div>
          <div class="stat">
            <div class="stat-label">Entries</div>
            <div class="stat-value"><span id="entryCount">0</span></div>
          </div>
        </div>

        <div class="progress">
          <div class="progress-bar" id="calorieProgress"></div>
        </div>

        <div class="macro-row">
          <div class="macro">
            <small>Protein</small>
            <strong><span id="proteinToday">0</span>g</strong>
          </div>
          <div class="macro">
            <small>Carbs</small>
            <strong><span id="carbsToday">0</span>g</strong>
          </div>
          <div class="macro">
            <small>Fat</small>
            <strong><span id="fatToday">0</span>g</strong>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="button-row">
          <button id="quickAddButton">+ Add food</button>
          <button class="secondary" id="viewEntriesButton">View entries</button>
        </div>
      </div>
    </section>

    <!-- ADD / EDIT -->
    <section class="screen" id="screen-add">
      <div class="card">
        <h2 id="addEditTitle">Add food</h2>

        <form id="foodForm">
          <div class="form-grid">
            <div class="full">
              <label for="foodName">Food name</label>
              <input id="foodName" type="text" placeholder="e.g. Chicken and rice" autocomplete="off" required>
            </div>

            <div>
              <label for="foodCalories">Calories</label>
              <input id="foodCalories" type="number" inputmode="decimal" min="0" step="any" placeholder="0" required>
            </div>

            <div>
              <label for="foodProtein">Protein (g)</label>
              <input id="foodProtein" type="number" inputmode="decimal" min="0" step="any" placeholder="0">
            </div>

            <div>
              <label for="foodCarbs">Carbs (g)</label>
              <input id="foodCarbs" type="number" inputmode="decimal" min="0" step="any" placeholder="0">
            </div>

            <div>
              <label for="foodFat">Fat (g)</label>
              <input id="foodFat" type="number" inputmode="decimal" min="0" step="any" placeholder="0">
            </div>
          </div>

          <div class="button-row">
            <button type="submit" id="saveFoodButton">Save food</button>
            <button type="button" class="secondary" id="cancelFoodButton">Cancel</button>
          </div>
        </form>
      </div>
    </section>

    <!-- ENTRIES -->
    <section class="screen" id="screen-entries">
      <div class="card">
        <h2>Today’s foods</h2>
        <div id="entriesList"></div>
      </div>

      <div class="card">
        <div class="button-row">
          <button id="addFromEntriesButton">+ Add food</button>
          <button class="danger" id="clearDayButton">Clear day</button>
        </div>
      </div>
    </section>

    <!-- GOALS -->
    <section class="screen" id="screen-goals">
      <div class="card">
        <h2>Daily goals</h2>

        <form id="goalsForm">
          <label for="goalCalories">Daily calorie limit</label>
          <input id="goalCalories" type="number" inputmode="decimal" min="0" step="any" placeholder="e.g. 2000" required>

          <label for="goalProtein">Protein goal (g)</label>
          <input id="goalProtein" type="number" inputmode="decimal" min="0" step="any" placeholder="e.g. 150">

          <label for="goalCarbs">Carbs goal (g)</label>
          <input id="goalCarbs" type="number" inputmode="decimal" min="0" step="any" placeholder="e.g. 220">

          <label for="goalFat">Fat goal (g)</label>
          <input id="goalFat" type="number" inputmode="decimal" min="0" step="any" placeholder="e.g. 70">

          <div class="button-row">
            <button type="submit">Save goals</button>
            <button type="button" class="secondary" id="resetGoalsButton">Reset</button>
          </div>
        </form>
      </div>

      <div class="card">
        <h2>Data controls</h2>
        <p style="color:var(--muted); font-size:14px; margin-top:0;">
          Your entries and goals are stored only in this iPhone browser’s local storage.
        </p>
        <button class="danger" id="deleteAllDataButton">Delete all app data</button>
      </div>
    </section>
  </div>

  <nav>
    <button class="active" data-screen="today">
      <span class="icon">🏠</span>
      Today
    </button>
    <button data-screen="add">
      <span class="icon">＋</span>
      Add
    </button>
    <button data-screen="entries">
      <span class="icon">📋</span>
      Foods
    </button>
    <button data-screen="goals">
      <span class="icon">🎯</span>
      Goals
    </button>
  </nav>

  <div class="toast" id="toast"></div>

  <div class="confirm-box" id="confirmBox">
    <div class="confirm-card">
      <h3 id="confirmTitle">Are you sure?</h3>
      <p id="confirmMessage">This cannot be undone.</p>
      <div class="button-row">
        <button class="danger" id="confirmYesButton">Delete</button>
        <button class="secondary" id="confirmNoButton">Cancel</button>
      </div>
    </div>
  </div>

  <script>
    "use strict";

    const STORAGE_KEYS = {
      goals: "dietTrackerGoals",
      days: "dietTrackerDays"
    };

    const state = {
      editingId: null,
      pendingDelete: null,
      pendingClear: null
    };

    const $ = (id) => document.getElementById(id);

    const todayKey = () => {
      const now = new Date();
      const y = now.getFullYear();
      const m = String(now.getMonth() + 1).padStart(2, "0");
      const d = String(now.getDate()).padStart(2, "0");
      return `${y}-${m}-${d}`;
    };

    const defaultGoals = {
      calories: 2000,
      protein: 0,
      carbs: 0,
      fat: 0
    };

    function loadJSON(key, fallback) {
      try {
        const raw = localStorage.getItem(key);
        if (!raw) return fallback;
        const parsed = JSON.parse(raw);
        return parsed && typeof parsed === "object" ? parsed : fallback;
      } catch {
        return fallback;
      }
    }

    function saveJSON(key, value) {
      localStorage.setItem(key, JSON.stringify(value));
    }

    function getGoals() {
      const stored = loadJSON(STORAGE_KEYS.goals, {});
      return {
        calories: Number(stored.calories) || 0,
        protein: Number(stored.protein) || 0,
        carbs: Number(stored.carbs) || 0,
        fat: Number(stored.fat) || 0
      };
    }

    function getDays() {
      return loadJSON(STORAGE_KEYS.days, {});
    }

    function getTodayEntries() {
      const days = getDays();
      const entries = days[todayKey()];
      return Array.isArray(entries) ? entries : [];
    }

    function saveTodayEntries(entries) {
      const days = getDays();
      days[todayKey()] = entries;
      saveJSON(STORAGE_KEYS.days, days);
    }

    function numberOrZero(value) {
      const n = Number(value);
      return Number.isFinite(n) && n >= 0 ? n : 0;
    }

    function round1(n) {
      return Math.round(n * 10) / 10;
    }

    function showToast(message) {
      const toast = $("toast");
      toast.textContent = message;
      toast.classList.add("show");
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => toast.classList.remove("show"), 2200);
    }

    function showScreen(name) {
      document.querySelectorAll(".screen").forEach((screen) => {
        screen.classList.remove("active");
      });
      $(`screen-${name}`).classList.add("active");

      document.querySelectorAll("nav button").forEach((button) => {
        button.classList.toggle("active", button.dataset.screen === name);
      });

      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function updateToday() {
      const entries = getTodayEntries();
      const goals = getGoals();

      const totals = entries.reduce(
        (acc, entry) => {
          acc.calories += numberOrZero(entry.calories);
          acc.protein += numberOrZero(entry.protein);
          acc.carbs += numberOrZero(entry.carbs);
          acc.fat += numberOrZero(entry.fat);
          return acc;
        },
        { calories: 0, protein: 0, carbs: 0, fat: 0 }
      );

      $("caloriesToday").textContent = round1(totals.calories);
      $("calorieGoalDisplay").textContent = round1(goals.calories);
      $("entryCount").textContent = entries.length;

      const remaining = goals.calories - totals.calories;
      $("caloriesRemaining").textContent = round1(remaining);

      $("proteinToday").textContent = round1(totals.protein);
      $("carbsToday").textContent = round1(totals.carbs);
      $("fatToday").textContent = round1(totals.fat);

      const percent = goals.calories > 0
        ? Math.min((totals.calories / goals.calories) * 100, 100)
        : 0;

      const bar = $("calorieProgress");
      bar.style.width = `${percent}%`;
      bar.classList.toggle("over", goals.calories > 0 && totals.calories > goals.calories);
    }

    function renderEntries() {
      const entries = getTodayEntries();
      const list = $("entriesList");
      list.innerHTML = "";

      if (entries.length === 0) {
        list.innerHTML = `<div class="empty">No foods added yet.<br>Tap <strong>+ Add food</strong> to begin.</div>`;
        return;
      }

      entries.forEach((entry) => {
        const item = document.createElement("div");
        item.className = "entry";

        const info = document.createElement("div");
        info.className = "entry-info";

        const name = document.createElement("div");
        name.className = "entry-name";
        name.textContent = entry.name;

        const macros = document.createElement("div");
        macros.className = "entry-macros";
        macros.textContent =
          `${round1(entry.calories)} kcal • P ${round1(entry.protein)}g • C ${round1(entry.carbs)}g • F ${round1(entry.fat)}g`;

        info.append(name, macros);

        const actions = document.createElement("div");
        actions.className = "entry-actions";

        const editButton = document.createElement("button");
        editButton.className = "secondary small";
        editButton.textContent = "Edit";
        editButton.addEventListener("click", () => startEdit(entry.id));

        const deleteButton = document.createElement("button");
        deleteButton.className = "danger small";
        deleteButton.textContent = "Delete";
        deleteButton.addEventListener("click", () => requestDelete(entry.id));

        actions.append(editButton, deleteButton);
        item.append(info, actions);
        list.appendChild(item);
      });
    }

    function clearFoodForm() {
      $("foodForm").reset();
      state.editingId = null;
      $("addEditTitle").textContent = "Add food";
      $("saveFoodButton").textContent = "Save food";
    }

    function startAdd() {
      clearFoodForm();
      showScreen("add");
      setTimeout(() => $("foodName").focus(), 250);
    }

    function startEdit(id) {
      const entry = getTodayEntries().find((item) => item.id === id);
      if (!entry) return;

      state.editingId = id;
      $("foodName").value = entry.name;
      $("foodCalories").value = entry.calories;
      $("foodProtein").value = entry.protein;
      $("foodCarbs").value = entry.carbs;
      $("foodFat").value = entry.fat;

      $("addEditTitle").textContent = "Edit food";
      $("saveFoodButton").textContent = "Update food";
      showScreen("add");
    }

    function requestDelete(id) {
      const entry = getTodayEntries().find((item) => item.id === id);
      if (!entry) return;

      state.pendingDelete = id;
      $("confirmTitle").textContent = "Delete food?";
      $("confirmMessage").textContent = `Delete “${entry.name}” from today’s entries?`;
      $("confirmYesButton").textContent = "Delete";
      $("confirmBox").classList.add("show");
    }

    function requestClearDay() {
      if (getTodayEntries().length === 0) {
        showToast("Today already has no entries");
        return;
      }

      state.pendingClear = true;
      $("confirmTitle").textContent = "Clear today?";
      $("confirmMessage").textContent = "This will delete every food entry recorded for today.";
      $("confirmYesButton").textContent = "Clear day";
      $("confirmBox").classList.add("show");
    }

    function requestDeleteAll() {
      state.pendingClear = false;
      state.pendingDelete = "ALL";
      $("confirmTitle").textContent = "Delete all data?";
      $("confirmMessage").textContent = "This permanently removes all saved days, foods, and goals from this browser.";
      $("confirmYesButton").textContent = "Delete all";
      $("confirmBox").classList.add("show");
    }

    function closeConfirm() {
      $("confirmBox").classList.remove("show");
      state.pendingDelete = null;
      state.pendingClear = null;
    }

    function confirmAction() {
      if (state.pendingDelete === "ALL") {
        localStorage.removeItem(STORAGE_KEYS.days);
        localStorage.removeItem(STORAGE_KEYS.goals);
        loadGoalsIntoForm();
        updateToday();
        renderEntries();
        showToast("All app data deleted");
      } else if (typeof state.pendingDelete === "string") {
        const entries = getTodayEntries().filter((entry) => entry.id !== state.pendingDelete);
        saveTodayEntries(entries);
        updateToday();
        renderEntries();
        showToast("Food deleted");
      } else if (state.pendingClear === true) {
        saveTodayEntries([]);
        updateToday();
        renderEntries();
        showToast("Today cleared");
      }

      closeConfirm();
    }

    function loadGoalsIntoForm() {
      const goals = getGoals();
      $("goalCalories").value = goals.calories || "";
      $("goalProtein").value = goals.protein || "";
      $("goalCarbs").value = goals.carbs || "";
      $("goalFat").value = goals.fat || "";
    }

    function saveGoals(event) {
      event.preventDefault();

      const goals = {
        calories: numberOrZero($("goalCalories").value),
        protein: numberOrZero($("goalProtein").value),
        carbs: numberOrZero($("goalCarbs").value),
        fat: numberOrZero($("goalFat").value)
      };

      saveJSON(STORAGE_KEYS.goals, goals);
      updateToday();
      showToast("Goals saved");
      showScreen("today");
    }

    function saveFood(event) {
      event.preventDefault();

      const name = $("foodName").value.trim();
      const calories = numberOrZero($("foodCalories").value);
      const protein = numberOrZero($("foodProtein").value);
      const carbs = numberOrZero($("foodCarbs").value);
      const fat = numberOrZero($("foodFat").value);

      if (!name) {
        showToast("Please enter a food name");
        return;
      }

      const entries = getTodayEntries();

      if (state.editingId) {
        const index = entries.findIndex((entry) => entry.id === state.editingId);
        if (index !== -1) {
          entries[index] = { id: state.editingId, name, calories, protein, carbs, fat };
        }
        showToast("Food updated");
      } else {
        entries.push({
          id: `${Date.now()}-${Math.random().toString(16).slice(2)}`,
          name,
          calories,
          protein,
          carbs,
          fat
        });
        showToast("Food added");
      }

      saveTodayEntries(entries);
      clearFoodForm();
      updateToday();
      renderEntries();
      showScreen("entries");
    }

    function init() {
      const now = new Date();
      $("todayDate").textContent = now.toLocaleDateString(undefined, {
        weekday: "long",
        day: "numeric",
        month: "long",
        year: "numeric"
      });

      document.querySelectorAll("nav button").forEach((button) => {
        button.addEventListener("click", () => {
          const target = button.dataset.screen;

          if (target === "add") {
            startAdd();
          } else if (target === "entries") {
            renderEntries();
            showScreen("entries");
          } else if (target === "goals") {
            loadGoalsIntoForm();
            showScreen("goals");
          } else {
            updateToday();
            showScreen("today");
          }
        });
      });

      $("settingsButton").addEventListener("click", () => {
        loadGoalsIntoForm();
        showScreen("goals");
      });

      $("quickAddButton").addEventListener("click", startAdd);
      $("addFromEntriesButton").addEventListener("click", startAdd);
      $("viewEntriesButton").addEventListener("click", () => {
        renderEntries();
        showScreen("entries");
      });

      $("foodForm").addEventListener("submit", saveFood);
      $("cancelFoodButton").addEventListener("click", () => {
        clearFoodForm();
        renderEntries();
        showScreen("entries");
      });

      $("goalsForm").addEventListener("submit", saveGoals);

      $("resetGoalsButton").addEventListener("click", () => {
        $("goalsForm").reset();
        $("goalCalories").value = defaultGoals.calories;
        showToast("Form reset");
      });

      $("clearDayButton").addEventListener("click", requestClearDay);
      $("deleteAllDataButton").addEventListener("click", requestDeleteAll);

      $("confirmYesButton").addEventListener("click", confirmAction);
      $("confirmNoButton").addEventListener("click", closeConfirm);

      $("confirmBox").addEventListener("click", (event) => {
        if (event.target === $("confirmBox")) closeConfirm();
      });

      loadGoalsIntoForm();
      updateToday();
      renderEntries();
    }

    document.addEventListener("DOMContentLoaded", init);
  </script>
</body>
</html>
